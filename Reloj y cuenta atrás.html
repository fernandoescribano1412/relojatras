<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reloj y cuenta atrás</title>
<style>
:root{
  --bg:#f6f5f2;--fg:#1d1d1f;--muted:#6b6b70;--accent:#2f6fed;--card:#ffffff;--line:#dcdad4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--fg:#f2f2f4;--muted:#9a9aa3;--accent:#6ea0ff;--card:#1c1c20;--line:#2c2c32;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--fg:#f2f2f4;--muted:#9a9aa3;--accent:#6ea0ff;--card:#1c1c20;--line:#2c2c32;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:16px;
}
h1{font-size:1.1rem;font-weight:600;margin:8px 0 16px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{
  border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:8px 18px;border-radius:999px;cursor:pointer
}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.panel{
  width:100%;max-width:420px;margin-top:24px;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center
}
.panel[hidden]{display:none}
svg.clock{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
.face{fill:none;stroke:var(--line);stroke-width:2}
.tick{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.hand-h{stroke:var(--fg);stroke-width:6;stroke-linecap:round}
.hand-m{stroke:var(--fg);stroke-width:4;stroke-linecap:round}
.hand-s{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.digital{font-size:2.2rem;font-variant-numeric:tabular-nums;margin-top:16px;font-weight:600}
.date{color:var(--muted);margin-top:4px;font-size:.95rem;text-transform:capitalize}
label{display:block;color:var(--muted);font-size:.95rem;margin-bottom:10px}
input[type="time"]{
  font:inherit;font-size:1.4rem;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);
  font-variant-numeric:tabular-nums
}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
button.action{
  font:inherit;font-weight:600;padding:10px 18px;border-radius:12px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff
}
button.ghost{background:transparent;color:var(--accent)}
.countdown{
  font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;
  margin:24px 0 8px;letter-spacing:.02em
}
.status{color:var(--muted);font-size:.95rem;min-height:1.4em}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:20px}
.bar > span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.done .countdown{color:var(--accent)}
</style>
</head>
<body>

<h1>Reloj y cuenta atrás</h1>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-reloj" aria-controls="panel-reloj" aria-selected="true">Reloj</button>
  <button class="tab" role="tab" id="tab-cuenta" aria-controls="panel-cuenta" aria-selected="false">Cuenta atrás</button>
</div>

<section class="panel" id="panel-reloj" role="tabpanel" aria-labelledby="tab-reloj">
  <svg class="clock" viewBox="0 0 200 200" aria-label="Reloj analógico">
    <circle class="face" cx="100" cy="100" r="96"></circle>
    <g id="ticks"></g>
    <line id="hour" class="hand-h" x1="100" y1="100" x2="100" y2="58"></line>
    <line id="minute" class="hand-m" x1="100" y1="100" x2="100" y2="30"></line>
    <line id="second" class="hand-s" x1="100" y1="112" x2="100" y2="22"></line>
    <circle cx="100" cy="100" r="4" fill="var(--accent)"></circle>
  </svg>
  <div class="digital" id="digital">--:--:--</div>
  <div class="date" id="date"></div>
</section>

<section class="panel" id="panel-cuenta" role="tabpanel" aria-labelledby="tab-cuenta" hidden>
  <label for="target">¿A qué hora quieres llegar?</label>
  <input type="time" id="target" step="1">
  <div class="row">
    <button class="action" id="start">Empezar cuenta atrás</button>
    <button class="action ghost" id="reset">Borrar</button>
  </div>
  <div class="countdown" id="countdown">--:--:--</div>
  <div class="status" id="status">Elige una hora y empieza.</div>
  <div class="bar"><span id="progress"></span></div>
</section>

<script>
// Marcas de las horas en la esfera
(function(){
  const g = document.getElementById('ticks');
  for (let i = 0; i < 12; i++) {
    const a = i * 30 * Math.PI / 180;
    const long = i % 3 === 0;
    const r1 = long ? 78 : 84, r2 = 92;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','tick');
    line.setAttribute('x1', 100 + r1 * Math.sin(a));
    line.setAttribute('y1', 100 - r1 * Math.cos(a));
    line.setAttribute('x2', 100 + r2 * Math.sin(a));
    line.setAttribute('y2', 100 - r2 * Math.cos(a));
    if (!long) line.setAttribute('stroke-width','1');
    g.appendChild(line);
  }
})();

const pad = n => String(n).padStart(2, '0');
const hourEl = document.getElementById('hour');
const minEl = document.getElementById('minute');
const secEl = document.getElementById('second');
const digitalEl = document.getElementById('digital');
const dateEl = document.getElementById('date');

function updateClock(){
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds() + now.getMilliseconds() / 1000;
  hourEl.setAttribute('transform', `rotate(${((h % 12) + m / 60) * 30} 100 100)`);
  minEl.setAttribute('transform', `rotate(${(m + s / 60) * 6} 100 100)`);
  secEl.setAttribute('transform', `rotate(${s * 6} 100 100)`);
  digitalEl.textContent = `${pad(h)}:${pad(m)}:${pad(now.getSeconds())}`;
  dateEl.textContent = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}

// Cuenta atrás (estado solo en memoria)
const targetInput = document.getElementById('target');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const countdownEl = document.getElementById('countdown');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progress');
const cuentaPanel = document.getElementById('panel-cuenta');

let targetMs = null;
let startMs = null;

function computeTarget(value){
  const [hh, mm, ss] = value.split(':').map(Number);
  const d = new Date();
  d.setHours(hh, mm, ss || 0, 0);
  if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1); // si ya pasó, es mañana
  return d.getTime();
}

function hms(ms){
  const total = Math.ceil(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function updateCountdown(){
  if (targetMs === null) return;
  const now = Date.now();
  const left = targetMs - now;
  if (left <= 0) {
    countdownEl.textContent = '00:00:00';
    statusEl.textContent = '¡Ha llegado la hora!';
    progressEl.style.width = '100%';
    cuentaPanel.classList.add('done');
    return;
  }
  cuentaPanel.classList.remove('done');
  countdownEl.textContent = hms(left);
  const total = targetMs - startMs;
  const pct = Math.min(100, Math.max(0, ((now - startMs) / total) * 100));
  progressEl.style.width = pct.toFixed(2) + '%';
  const when = new Date(targetMs);
  statusEl.textContent = `Faltan para las ${pad(when.getHours())}:${pad(when.getMinutes())}`;
}

startBtn.addEventListener('click', () => {
  if (!targetInput.value) {
    statusEl.textContent = 'Primero elige una hora.';
    return;
  }
  startMs = Date.now();
  targetMs = computeTarget(targetInput.value);
  updateCountdown();
});

resetBtn.addEventListener('click', () => {
  targetMs = null;
  startMs = null;
  targetInput.value = '';
  countdownEl.textContent = '--:--:--';
  statusEl.textContent = 'Elige una hora y empieza.';
  progressEl.style.width = '0%';
  cuentaPanel.classList.remove('done');
});

// Pestañas
const tabs = [...document.querySelectorAll('.tab')];
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
    document.querySelectorAll('[role="tabpanel"]').forEach(p => {
      p.hidden = p.id !== tab.getAttribute('aria-controls');
    });
  });
});

setInterval(() => { updateClock(); updateCountdown(); }, 250);
updateClock();
</script>
</body>
</html>
